<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Órdenes de servicio</title>
<link rel="stylesheet" href="/static/estilos.css">
</head>
<body>
<header>
  <h1>Órdenes de servicio</h1>
  <nav>
    <button data-vista="ordenes" class="activa">Órdenes</button>
    <button data-vista="nueva">Nueva orden</button>
    <button data-vista="equipos">Equipos</button>
    <button data-vista="refacciones">Refacciones</button>
  </nav>
</header>

<main>
  <section id="ordenes" class="vista activa">
    <h2>Órdenes</h2>
    <label>Estado
      <select id="filtro-estado">
        <option value="">Todas</option>
        <option value="abierta">Abiertas</option>
        <option value="en_proceso">En proceso</option>
        <option value="cerrada">Cerradas</option>
      </select>
    </label>
    <table>
      <thead><tr><th>#</th><th>Apertura</th><th>Cliente</th><th>Equipo</th><th>Tipo</th><th>Técnico</th><th>Estado</th><th class="num">Total</th></tr></thead>
      <tbody id="lista-ordenes"></tbody>
    </table>

    <div id="detalle" hidden>
      <h3 id="detalle-titulo"></h3>
      <p id="detalle-datos" class="nota"></p>
      <table>
        <thead><tr><th>Refacción</th><th class="num">Cantidad</th><th class="num">Precio</th><th class="num">Importe</th></tr></thead>
        <tbody id="detalle-refacciones"></tbody>
      </table>
      <div id="acciones">
        <div class="fila">
          <select id="tecnico"></select>
          <button id="asignar" class="secundario">Asignar técnico</button>
        </div>
        <div class="fila">
          <select id="refaccion"></select>
          <input id="cantidad-refaccion" class="cantidad" type="number" min="1" value="1">
          <button id="agregar-refaccion" class="secundario">Agregar refacción</button>
        </div>
        <div class="fila">
          <input id="diagnostico" placeholder="Diagnóstico y trabajo realizado" class="ancho">
          <input id="horas" type="number" min="0.5" step="0.5" placeholder="Horas" class="cantidad">
          <button id="cerrar">Cerrar orden</button>
        </div>
      </div>
      <dl id="costos"></dl>
      <p id="mensaje-detalle" class="mensaje"></p>
    </div>
  </section>

  <section id="nueva" class="vista">
    <h2>Nueva orden</h2>
    <label>Cliente
      <select id="cliente"></select>
    </label>
    <label>Equipo
      <select id="equipo"></select>
    </label>
    <label>Tipo
      <select id="tipo-orden">
        <option value="correctiva">Correctiva</option>
        <option value="preventiva">Preventiva</option>
      </select>
    </label>
    <label>Falla reportada
      <input id="falla" class="ancho" placeholder="Qué reporta el cliente">
    </label>
    <button id="abrir-orden">Abrir orden</button>
    <p id="mensaje-nueva" class="mensaje"></p>
  </section>

  <section id="equipos" class="vista">
    <h2>Equipos</h2>
    <table>
      <thead><tr><th>Serie</th><th>Tipo</th><th>Marca y modelo</th><th>Cliente</th><th>Ubicación</th><th>Instalado</th></tr></thead>
      <tbody id="lista-equipos"></tbody>
    </table>
  </section>

  <section id="refacciones" class="vista">
    <h2>Refacciones</h2>
    <table>
      <thead><tr><th>Clave</th><th>Descripción</th><th class="num">Precio</th><th class="num">Existencias</th></tr></thead>
      <tbody id="lista-refacciones"></tbody>
    </table>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
